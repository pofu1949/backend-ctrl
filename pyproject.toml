[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ctrlstore"
version = "0.1.0"
description = "单机内容库与发布服务"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "sqlalchemy==2.0.40",
  "alembic==1.15.2",
  "pydantic-settings==2.9.1",
  "psutil==7.0.0",
  "argon2-cffi==25.1.0",
  "pillow==13.0.0",
  "python-multipart==0.0.32",
  "python-frontmatter==1.3.0",
  "markdown==3.11.2",
  "nh3==0.3.7",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "httpx==0.28.1",
  "ruff==0.11.8",
  "build==1.2.2.post1",
]

[project.scripts]
ctrlstore = "ctrlstore.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctrlstore"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "ctrlstore/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", ".tools", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入就是靠参数默认值表达，不是可变默认值的误用。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "ctrlstore.auth.deps.require_permission",
]

[dependency-groups]
dev = [
    "build==1.2.2.post1",
    "httpx==0.28.1",
    "pytest==8.3.5",
    "ruff==0.11.8",
]

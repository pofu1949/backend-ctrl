# CtrlStore 配置示例。
# 复制到 /etc/ctrlstore/config.toml 后按部署环境修改；权限 0640，属主 ctrlstore。
#
# 机密项（session_secret、pageview_hmac_secret）不写在这里：
# 它们只来自环境变量，或下面 secrets_file 指向的 0600 文件。写在这里会被拒绝启动。

# —— 路径 ——
# 数据目录必须可配置：磁盘容量与是否独立挂载尚未确定（企划第 23 章 Q1）。
data_dir = "/var/lib/ctrlstore"

# 以下路径默认都落在 data_dir 下，需要单独挂载时再逐项覆盖。
# database_path = "/var/lib/ctrlstore/ctrlstore.db"
# originals_dir = "/var/lib/ctrlstore/originals"
# derivatives_dir = "/var/lib/ctrlstore/derivatives"
# public_dir = "/var/lib/ctrlstore/public"
# tmp_dir = "/var/lib/ctrlstore/tmp"

# —— 对外地址 ——
# 备案前用实际入口，例如局域网地址；备案后只改这一项，内容 ID 不变。
public_base_url = "http://127.0.0.1:8000"

# 短文案独立计数，不占七类内容的条数或字节配额。
entry_limit = 2000

# 私有下载是否交给 Nginx 发送（X-Accel-Redirect）。
# 生产必须为 true；本地直接跑 API、没有 Nginx 时设成 false，由进程发送文件。
x_accel_redirect = true

# —— 健康阈值 ——
# 剩余空间低于 10 GB 或低于总容量 5% 即视为 degraded，并拒绝新的上传。
min_free_bytes = 10737418240
min_free_ratio = 0.05
min_available_memory_bytes = 1073741824

# —— 会话与 Cookie ——
# 绝对有效期 12 小时，空闲 2 小时；空闲不能长于绝对。
session_absolute_hours = 12
session_idle_hours = 2
# 启用 HTTPS 之后必须改为 true，否则会话 Cookie 可能随明文请求被带走。
cookie_secure = false

# —— 单文件上限（字节）——
# 视频上限调大之前先确认数据盘剩余空间：企划按「最大视频 × 2」估算。
[limits]
image = 31457280        # 30 MB
video = 2147483648      # 2 GB
markdown = 2097152      # 2 MB
text = 2097152          # 2 MB
pdf = 104857600         # 100 MB
docx = 52428800         # 50 MB
xlsx = 52428800         # 50 MB

# —— 版本保留、回收站与派生 ——
# 图片与文档保留最近 5 个版本；视频只留待发布版与已发布版。
# 两个指针占用的版本不计入上限，永远不会被这条规则删掉。
version_retention = 5
video_version_retention = 2
# 回收站保留天数。到期由 worker 彻底删除；仍被封面或集合引用时会跳过。
trash_retention_days = 30
# 缩略图与展示图的最长边。展示图不替代原图，只用于中等尺寸场景。
thumb_max_side = 480
display_max_side = 1600

# —— 访问上报（第 8 部分）——
# 每个站点令牌每分钟最多接受多少条页面访问上报。网站转发量远低于这个数。
pageview_rate_per_minute = 600

# —— 配额（第 9 部分）——
# 0 表示不限。计入未彻底删除的所有版本与派生文件，含回收站；硬链接不重复计。
user_quota_bytes = 0        # 单个账号，例如 42949672960（40 GB）
library_quota_bytes = 0     # 全库，例如 214748364800（200 GB）
# 条数配额：一条内容不论多少版本都算 1；含回收站。
user_quota_items = 0        # 单个账号，例如 5000
library_quota_items = 0     # 全库，例如 20000

# —— 运维（第 9 部分）——
# 备份脚本默认写到 /var/backups/ctrlstore；所有者健康接口读这里最新的成功清单。
backup_dir = "/var/backups/ctrlstore"
# 站点搜索默认关闭。打开后只搜已发布、且该站点能读到的内容。
site_search_enabled = false

# —— 进程 ——
log_level = "INFO"
api_host = "127.0.0.1"
api_port = 8000

# —— 密钥文件 ——
# 相对路径按本配置文件所在目录解析。权限必须是 0600。
# secrets_file = "/etc/ctrlstore/secrets.toml"

# CtrlStore 的可选 Docker Compose（决议 Q13）。
#
# 用法（在 deploy/ 目录）：
#   cp ctrlstore.example.toml ctrlstore.toml
#   printf 'CTRLSTORE_SESSION_SECRET=...\nCTRLSTORE_PAGEVIEW_HMAC_SECRET=...\n' > secrets.env
#   chmod 600 secrets.env
#   docker compose -f docker-compose.example.yml up -d --build
#
# 生产仍以 systemd 为主：两个 API 进程由 ctrlstore-api@0/@1 启动，
# 这里只跑一个 API 容器，省内存；需要两个时用反向代理指向两个副本。
# public/ 由宿主机上的 Nginx 直接 alias，不经容器。
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["ctrlstore", "serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [./secrets.env]
    environment:
      CTRLSTORE_CONFIG: /etc/ctrlstore/config.toml
      CTRLSTORE_DATA_DIR: /var/lib/ctrlstore
    volumes:
      - ./ctrlstore.toml:/etc/ctrlstore/config.toml:ro
      - ctrlstore-data:/var/lib/ctrlstore
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["ctrlstore", "worker"]
    env_file: [./secrets.env]
    environment:
      CTRLSTORE_CONFIG: /etc/ctrlstore/config.toml
      CTRLSTORE_DATA_DIR: /var/lib/ctrlstore
    volumes:
      - ./ctrlstore.toml:/etc/ctrlstore/config.toml:ro
      - ctrlstore-data:/var/lib/ctrlstore
    restart: unless-stopped

volumes:
  ctrlstore-data:

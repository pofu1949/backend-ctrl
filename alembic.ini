[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/src
# 连接串由 ctrlstore.db.run_migrations 在运行时注入，避免把路径写死在仓库里。
sqlalchemy.url = sqlite:////var/lib/ctrlstore/ctrlstore.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
